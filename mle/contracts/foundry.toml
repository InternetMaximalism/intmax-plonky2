[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.29"
via_ir = true
evm_version = "prague"
optimizer = true
# Match the production parent build and keep deployable verifier bytecode below
# EIP-170; gas benchmarks report the resulting production configuration.
optimizer_runs = 200
fs_permissions = [
    { access = "read", path = "./" },
    { access = "read", path = "../testdata" },
]
